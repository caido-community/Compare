[tools]
node = "24.11.1"
pnpm = "11.18.0"

[tasks.validate]
description = "Run all quality checks (typecheck, lint, knip, test)"
run = """
pnpm install --frozen-lockfile
pnpm typecheck
pnpm lint
pnpm knip
pnpm test
"""

[tasks.build]
description = "Build the plugin package"
run = """
pnpm install --frozen-lockfile
pnpm build
"""
